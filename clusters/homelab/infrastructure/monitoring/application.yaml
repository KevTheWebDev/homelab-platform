apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: ">=0.0.0"
    helm:
      releaseName: kube-prometheus-stack
      values: |
        grafana:
          enabled: true
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          nodeSelector:
            kubernetes.io/hostname: k3s-04
          service:
            type: ClusterIP
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web
            hosts:
              - grafana.homelab.local
            path: /
          persistence:
            enabled: false

        prometheus:
          prometheusSpec:
            retention: 7d
            retentionSize: 8GB
            replicas: 1
            nodeSelector:
              kubernetes.io/hostname: k3s-04
            storageSpec: {}
            additionalScrapeConfigs:
              - job_name: homelab-icmp
                metrics_path: /probe
                params:
                  module:
                    - icmp
                static_configs:
                  - targets:
                      - 192.168.0.1
                    labels:
                      target_name: gateway
                      target_type: network
                  - targets:
                      - 192.168.0.50
                    labels:
                      target_name: proxmox-pve1
                      target_type: proxmox
                  - targets:
                      - 192.168.0.52
                    labels:
                      target_name: proxmox-masternode
                      target_type: proxmox
                  - targets:
                      - 192.168.0.121
                    labels:
                      target_name: k3s-01
                      target_type: k3s-node
                  - targets:
                      - 192.168.0.122
                    labels:
                      target_name: k3s-02
                      target_type: k3s-node
                  - targets:
                      - 192.168.0.123
                    labels:
                      target_name: k3s-03
                      target_type: k3s-node
                  - targets:
                      - 192.168.0.124
                    labels:
                      target_name: k3s-04
                      target_type: k3s-node
                  - targets:
                      - 192.168.0.125
                    labels:
                      target_name: k3s-05
                      target_type: k3s-node
                  - targets:
                      - 192.168.0.126
                    labels:
                      target_name: k3s-06
                      target_type: k3s-node
                  - targets:
                      - 192.168.0.200
                    labels:
                      target_name: traefik-ingress
                      target_type: loadbalancer
                  - targets:
                      - 192.168.0.201
                    labels:
                      target_name: argocd
                      target_type: loadbalancer
                  - targets:
                      - 192.168.0.205
                    labels:
                      target_name: pihole
                      target_type: dns
                relabel_configs:
                  - source_labels:
                      - __address__
                    target_label: __param_target
                  - source_labels:
                      - __param_target
                    target_label: instance
                  - target_label: __address__
                    replacement: blackbox-exporter.monitoring.svc.cluster.local:9115

              - job_name: homelab-tcp
                metrics_path: /probe
                params:
                  module:
                    - tcp_connect
                static_configs:
                  - targets:
                      - 192.168.0.50:8006
                    labels:
                      target_name: proxmox-pve1-web
                      target_type: proxmox
                  - targets:
                      - 192.168.0.52:8006
                    labels:
                      target_name: proxmox-masternode-web
                      target_type: proxmox
                  - targets:
                      - 192.168.0.52:22
                    labels:
                      target_name: proxmox-masternode-ssh
                      target_type: proxmox
                  - targets:
                      - 192.168.0.121:6443
                    labels:
                      target_name: k3s-api
                      target_type: control-plane
                  - targets:
                      - 192.168.0.200:80
                    labels:
                      target_name: traefik-web
                      target_type: ingress
                  - targets:
                      - 192.168.0.201:443
                    labels:
                      target_name: argocd-https
                      target_type: gitops
                  - targets:
                      - 192.168.0.205:53
                    labels:
                      target_name: pihole-dns-tcp
                      target_type: dns
                  - targets:
                      - 192.168.0.121:22
                    labels:
                      target_name: k3s-01-ssh
                      target_type: k3s-node
                  - targets:
                      - 192.168.0.122:22
                    labels:
                      target_name: k3s-02-ssh
                      target_type: k3s-node
                  - targets:
                      - 192.168.0.123:22
                    labels:
                      target_name: k3s-03-ssh
                      target_type: k3s-node
                  - targets:
                      - 192.168.0.124:22
                    labels:
                      target_name: k3s-04-ssh
                      target_type: k3s-node
                  - targets:
                      - 192.168.0.125:22
                    labels:
                      target_name: k3s-05-ssh
                      target_type: k3s-node
                  - targets:
                      - 192.168.0.126:22
                    labels:
                      target_name: k3s-06-ssh
                      target_type: k3s-node
                relabel_configs:
                  - source_labels:
                      - __address__
                    target_label: __param_target
                  - source_labels:
                      - __param_target
                    target_label: instance
                  - target_label: __address__
                    replacement: blackbox-exporter.monitoring.svc.cluster.local:9115

        alertmanager:
          alertmanagerSpec:
            replicas: 1
            nodeSelector:
              kubernetes.io/hostname: k3s-04

        kube-state-metrics:
          nodeSelector:
            kubernetes.io/hostname: k3s-04

        prometheus-node-exporter:
          tolerations:
            - operator: Exists

        additionalPrometheusRulesMap:
          homelab-platform-alerts:
            groups:
              - name: homelab.platform
                rules:
                  - alert: HomelabNodeNotReady
                    expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                    for: 5m
                    labels:
                      severity: critical
                      category: node
                    annotations:
                      summary: "Kubernetes node is not Ready"
                      description: "Node {{ $labels.node }} has not been Ready for at least 5 minutes."

                  - alert: HomelabNodeExporterDown
                    expr: up{job="kube-prometheus-stack-prometheus-node-exporter"} == 0
                    for: 5m
                    labels:
                      severity: critical
                      category: node
                    annotations:
                      summary: "Node exporter target is down"
                      description: "Prometheus cannot scrape node-exporter on {{ $labels.instance }} for at least 5 minutes."

                  - alert: HomelabPodCrashLooping
                    expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[10m]) >= 1
                    for: 5m
                    labels:
                      severity: warning
                      category: workload
                    annotations:
                      summary: "Pod is crash looping"
                      description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is in CrashLoopBackOff."

                  - alert: HomelabDeploymentUnavailable
                    expr: kube_deployment_status_replicas_unavailable > 0
                    for: 10m
                    labels:
                      severity: warning
                      category: workload
                    annotations:
                      summary: "Deployment has unavailable replicas"
                      description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ $value }} unavailable replica(s)."

                  - alert: HomelabPersistentVolumeClaimPending
                    expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
                    for: 10m
                    labels:
                      severity: warning
                      category: storage
                    annotations:
                      summary: "PVC is pending"
                      description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has been Pending for at least 10 minutes."

                  - alert: HomelabPersistentVolumeClaimLost
                    expr: kube_persistentvolumeclaim_status_phase{phase="Lost"} == 1
                    for: 1m
                    labels:
                      severity: critical
                      category: storage
                    annotations:
                      summary: "PVC is lost"
                      description: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is Lost."

                  - alert: HomelabKubeAPITargetDown
                    expr: up{job="apiserver"} == 0
                    for: 2m
                    labels:
                      severity: critical
                      category: control-plane
                    annotations:
                      summary: "Kubernetes API scrape target is down"
                      description: "Prometheus cannot scrape a Kubernetes API target at {{ $labels.instance }}."

                  - alert: HomelabArgocdAppOutOfSync
                    expr: argocd_app_info{sync_status!="Synced"} == 1
                    for: 15m
                    labels:
                      severity: warning
                      category: gitops
                    annotations:
                      summary: "Argo CD application is out of sync"
                      description: "Argo CD app {{ $labels.name }} is {{ $labels.sync_status }} for at least 15 minutes."

                  - alert: HomelabNetworkProbeFailed
                    expr: probe_success{job=~"homelab-icmp|homelab-tcp"} == 0
                    for: 2m
                    labels:
                      severity: critical
                      category: network
                    annotations:
                      summary: "Network probe failed"
                      description: "{{ $labels.target_name }} probe failed for target {{ $labels.instance }}."

                  - alert: HomelabNetworkLatencyHigh
                    expr: probe_duration_seconds{job="homelab-icmp"} > 0.1
                    for: 5m
                    labels:
                      severity: warning
                      category: network
                    annotations:
                      summary: "Network probe latency is high"
                      description: "{{ $labels.target_name }} ICMP probe latency is above 100ms for at least 5 minutes."
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
