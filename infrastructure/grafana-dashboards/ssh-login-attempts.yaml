apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ssh-login-attempts
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ssh-login-attempts.json: |
    {
      "title": "SSH Login Attempts",
      "uid": "ssh-login-attempts",
      "schemaVersion": 39,
      "version": 3,
      "refresh": "30s",
      "tags": ["homelab", "ssh", "security", "loki"],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "loki",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {
              "text": "Loki",
              "value": "Loki"
            }
          },
          {
            "name": "host",
            "label": "Host",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "${loki}"
            },
            "query": "label_values({job=\"ssh-auth\"}, host)",
            "refresh": 1,
            "allValue": ".*",
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Overview",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "type": "stat",
          "title": "Successful Logins",
          "description": "Accepted SSH logins in the selected time range.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "red" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki}" },
              "expr": "sum(count_over_time({job=\"ssh-auth\", host=~\"${host:regex}\"} |~ \"Accepted password|Accepted publickey|Accepted keyboard-interactive\" [$__range]))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Failed Logins",
          "description": "Failed SSH authentication attempts in the selected time range.",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "green" },
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki}" },
              "expr": "sum(count_over_time({job=\"ssh-auth\", host=~\"${host:regex}\"} |~ \"Failed password|Invalid user|authentication failure|Failed keyboard-interactive\" [$__range]))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Unique Source IPs",
          "description": "Unique client IPs seen in SSH auth-result log lines.",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "blue" },
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki}" },
              "expr": "count(sum by (source_ip) (count_over_time({job=\"ssh-auth\", host=~\"${host:regex}\"} |~ \"Accepted password|Accepted publickey|Accepted keyboard-interactive|Failed password|Invalid user\" | regexp \"from (?P<source_ip>[0-9.]+)\" [$__range])))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Unique Users",
          "description": "Unique usernames seen in accepted SSH logins.",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "purple" },
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "purple", "value": null }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki}" },
              "expr": "count(sum by (user) (count_over_time({job=\"ssh-auth\", host=~\"${host:regex}\"} |~ \"Accepted password|Accepted publickey|Accepted keyboard-interactive\" | regexp \"Accepted (?:password|publickey|keyboard-interactive) for (?P<user>[^ ]+)\" [$__range])))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Authentication Trends",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "SSH Auth Events Over Time",
          "description": "Accepted and failed authentication events grouped by host.",
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 7 },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "lineInterpolation": "linear",
                "barAlignment": 0,
                "lineWidth": 1,
                "fillOpacity": 35,
                "gradientMode": "none",
                "spanNulls": false,
                "insertNulls": false,
                "showPoints": "never",
                "pointSize": 5,
                "stacking": { "mode": "none", "group": "A" },
                "axisPlacement": "auto",
                "axisLabel": "",
                "axisColorMode": "text",
                "scaleDistribution": { "type": "linear" },
                "hideFrom": { "tooltip": false, "viz": false, "legend": false },
                "thresholdsStyle": { "mode": "off" }
              },
              "color": { "mode": "palette-classic" },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": ["sum"],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki}" },
              "expr": "sum by (host) (count_over_time({job=\"ssh-auth\", host=~\"${host:regex}\"} |~ \"Accepted password|Accepted publickey|Accepted keyboard-interactive\" [$__interval]))",
              "legendFormat": "Accepted - {{host}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "loki", "uid": "${loki}" },
              "expr": "sum by (host) (count_over_time({job=\"ssh-auth\", host=~\"${host:regex}\"} |~ \"Failed password|Invalid user|authentication failure|Failed keyboard-interactive\" [$__interval]))",
              "legendFormat": "Failed - {{host}}",
              "refId": "B"
            }
          ]
        },
        {
          "type": "piechart",
          "title": "Auth Method Distribution",
          "description": "Accepted SSH login methods.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 7 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "displayLabels": ["name", "value"],
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "values": ["value"]
            },
            "pieType": "donut",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki}" },
              "expr": "sum by (method) (count_over_time({job=\"ssh-auth\", host=~\"${host:regex}\"} |~ \"Accepted password|Accepted publickey|Accepted keyboard-interactive\" | regexp \"Accepted (?P<method>password|publickey|keyboard-interactive)\" [$__range]))",
              "legendFormat": "{{method}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Source Analysis",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 },
          "collapsed": false
        },
        {
          "type": "table",
          "title": "Logins by Source IP & User",
          "description": "Accepted SSH logins grouped by source IP, username, and host.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": { "type": "auto" },
                "inspect": false
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Value" },
                "properties": [
                  { "id": "displayName", "value": "Login Count" },
                  { "id": "custom.align", "value": "right" }
                ]
              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": ["sum"],
              "show": false
            },
            "showHeader": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki}" },
              "expr": "sum by (host, user, source_ip) (count_over_time({job=\"ssh-auth\", host=~\"${host:regex}\"} |~ \"Accepted password|Accepted publickey|Accepted keyboard-interactive\" | regexp \"Accepted (?:password|publickey|keyboard-interactive) for (?P<user>[^ ]+) from (?P<source_ip>[0-9.]+)\" [$__range]))",
              "legendFormat": "{{source_ip}} / {{user}} / {{host}}",
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "source_ip": 0,
                  "user": 1,
                  "host": 2,
                  "Value": 3
                },
                "renameByName": {
                  "source_ip": "Source IP",
                  "user": "User",
                  "host": "Host",
                  "Value": "Login Count"
                }
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Logins by Source IP Over Time",
          "description": "Accepted SSH logins over time, grouped by client IP.",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "lineInterpolation": "linear",
                "barAlignment": 0,
                "lineWidth": 1,
                "fillOpacity": 35,
                "gradientMode": "none",
                "spanNulls": false,
                "insertNulls": false,
                "showPoints": "auto",
                "pointSize": 4,
                "stacking": { "mode": "none", "group": "A" },
                "axisPlacement": "auto",
                "axisLabel": "",
                "axisColorMode": "text",
                "scaleDistribution": { "type": "linear" },
                "hideFrom": { "tooltip": false, "viz": false, "legend": false },
                "thresholdsStyle": { "mode": "off" }
              },
              "color": { "mode": "palette-classic" },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": ["sum"],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki}" },
              "expr": "sum by (source_ip) (count_over_time({job=\"ssh-auth\", host=~\"${host:regex}\"} |~ \"Accepted password|Accepted publickey|Accepted keyboard-interactive\" | regexp \"from (?P<source_ip>[0-9.]+)\" [$__interval]))",
              "legendFormat": "{{source_ip}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Connection Activity",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 25 },
          "collapsed": false
        },
        {
          "type": "stat",
          "title": "SSH Connection Events",
          "description": "All SSH daemon/session events, including connection-open/close messages.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 26 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "orange" },
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "orange", "value": null }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki}" },
              "expr": "sum(count_over_time({job=\"ssh-auth\", host=~\"${host:regex}\"} |~ \"sshd|sshd-session\" [$__range]))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "SSH Connection Events Over Time",
          "description": "All SSH daemon/session events by host. Useful for spotting scans, automation, or noisy clients.",
          "gridPos": { "h": 5, "w": 18, "x": 6, "y": 26 },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "lineInterpolation": "linear",
                "barAlignment": 0,
                "lineWidth": 1,
                "fillOpacity": 35,
                "gradientMode": "none",
                "spanNulls": false,
                "insertNulls": false,
                "showPoints": "never",
                "pointSize": 5,
                "stacking": { "mode": "none", "group": "A" },
                "axisPlacement": "auto",
                "axisLabel": "",
                "axisColorMode": "text",
                "scaleDistribution": { "type": "linear" },
                "hideFrom": { "tooltip": false, "viz": false, "legend": false },
                "thresholdsStyle": { "mode": "off" }
              },
              "color": { "mode": "palette-classic" },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": ["sum"],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki}" },
              "expr": "sum by (host) (count_over_time({job=\"ssh-auth\", host=~\"${host:regex}\"} |~ \"sshd|sshd-session\" [$__interval]))",
              "legendFormat": "{{host}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "row",
          "title": "Recent Events",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 31 },
          "collapsed": false
        },
        {
          "type": "logs",
          "title": "Recent SSH Auth Log Events",
          "description": "Raw SSH auth logs from K3s nodes.",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 32 },
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "${loki}" },
              "expr": "{job=\"ssh-auth\", host=~\"${host:regex}\"} |~ \"sshd|sshd-session|Failed password|Invalid user|Accepted password|Accepted publickey|authentication failure|Connection closed\"",
              "refId": "A"
            }
          ]
        }
      ]
    }
