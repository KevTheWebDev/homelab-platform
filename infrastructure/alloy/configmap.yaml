apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

    local.file_match "ssh_auth_logs" {
      path_targets = [
        {
          __path__ = "/host/var/log/auth.log",
          job      = "ssh-auth",
          host     = env("NODE_NAME"),
        },
      ]
    }

    loki.source.file "ssh_auth_logs" {
      targets    = local.file_match.ssh_auth_logs.targets
      forward_to = [loki.write.default.receiver]
    }
