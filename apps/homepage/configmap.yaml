apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Kevin's Homelab
    description: Proxmox + K3s GitOps homelab platform
    theme: dark
    color: slate
    layout:
      Platform:
        style: row
        columns: 4
      Kubernetes:
        style: row
        columns: 4
      Documentation:
        style: row
        columns: 4

  services.yaml: |
    - Platform:
        - Argo CD:
            href: https://argocd.homelab.local
            description: GitOps control plane
            icon: argo-cd.png
        - Proxmox pve1:
            href: https://192.168.0.50:8006
            description: Proxmox host
            icon: proxmox.png
        - GitHub Repo:
            href: https://github.com/kevthewebdev/homelab-platform
            description: Public homelab-platform repo
            icon: github.png

    - Kubernetes:
        - Test Nginx:
            href: http://nginx.homelab.local
            description: First GitOps-deployed test app
            icon: nginx.png
        - Homepage:
            href: http://homepage.homelab.local
            description: Homelab dashboard
            icon: homepage.png
        - Homarr:
            href: http://homarr.homelab.local
            description: Alternate homelab dashboard
            icon: homarr.png
        - Grafana:
            href: http://grafana.homelab.local
            description: Cluster metrics and dashboards
            icon: grafana.png
        - Uptime Kuma:
            href: http://uptime.homelab.local
            description: Service uptime checks
            icon: uptime-kuma.png
        - Pi-hole:
            href: http://pihole.homelab.local/admin
            description: Homelab DNS and ad blocking
            icon: pi-hole.png
        - n8n:
            href: http://n8n.homelab.local
            description: Workflow automation platform
            icon: n8n.png
        - Storage Docs:
            href: https://github.com/kevthewebdev/homelab-platform/blob/main/docs/storage.md
            description: Longhorn storage plan
            icon: github.png

    - Documentation:
        - Architecture:
            href: https://github.com/kevthewebdev/homelab-platform/blob/main/docs/architecture.md
            description: Platform architecture notes
            icon: github.png
        - Network Plan:
            href: https://github.com/kevthewebdev/homelab-platform/blob/main/docs/network.md
            description: Node and MetalLB IP plan
            icon: github.png
        - Runbook:
            href: https://github.com/kevthewebdev/homelab-platform/blob/main/docs/runbook.md
            description: Operational commands
            icon: github.png
        - Pi-hole Docs:
            href: https://github.com/kevthewebdev/homelab-platform/blob/main/docs/pihole.md
            description: DNS service notes
            icon: github.png
        - Uptime Kuma Docs:
            href: https://github.com/kevthewebdev/homelab-platform/blob/main/docs/uptime-kuma.md
            description: Uptime monitoring notes
            icon: github.png
        - Homarr Docs:
            href: https://github.com/kevthewebdev/homelab-platform/blob/main/docs/homarr.md
            description: Alternate dashboard notes
            icon: github.png
        - n8n Docs:
            href: https://github.com/kevthewebdev/homelab-platform/blob/main/docs/n8n.md
            description: Workflow automation notes
            icon: github.png

  bookmarks.yaml: |
    - Cloud Native:
        - Kubernetes:
            - abbr: K8s
              href: https://kubernetes.io/docs/
        - K3s:
            - abbr: K3s
              href: https://docs.k3s.io/
        - Argo CD:
            - abbr: Argo
              href: https://argo-cd.readthedocs.io/
        - MetalLB:
            - abbr: MLB
              href: https://metallb.io/
        - Prometheus:
            - abbr: Prom
              href: https://prometheus.io/docs/
        - Grafana:
            - abbr: Graf
              href: https://grafana.com/docs/
        - Longhorn:
            - abbr: LH
              href: https://longhorn.io/docs/
        - Pi-hole:
            - abbr: DNS
              href: https://docs.pi-hole.net/

  widgets.yaml: |
    - resources:
        backend: kubernetes
        expanded: true
        cpu: true
        memory: true

    - search:
        provider: duckduckgo
        target: _blank

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: |
    # Docker integration intentionally disabled.

  proxmox.yaml: |
    # Proxmox integration intentionally disabled for now.

  proxmox.json: |
    {}
